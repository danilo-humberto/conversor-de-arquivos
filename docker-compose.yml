x-application-environment: &application-environment
  PORT: "3000"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-conversor}
  POSTGRES_USER: ${POSTGRES_USER:-conversor}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conversor-local-password}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-conversor}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-conversor-local-password}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
  MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT:-9000}
  MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL:-false}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-conversor}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-conversor-local-password}
  MINIO_SOURCE_URL_EXPIRY_SECONDS: ${MINIO_SOURCE_URL_EXPIRY_SECONDS:-604800}
  MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-104857600}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: ${MAIL_FROM:-no-reply@conversor.local}

x-application-build: &application-build
  context: .
  dockerfile: Dockerfile.app

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conversor}
      POSTGRES_USER: ${POSTGRES_USER:-conversor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-conversor-local-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_v18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conversor} -d ${POSTGRES_DB:-conversor}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-conversor}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-conversor-local-password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics --quiet check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-conversor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-conversor-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "1025:1025"
      - "8025:8025"

  migrate:
    image: conversor-app:local
    command: npm run db:migrate
    environment: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *application-build
    image: conversor-app:local
    command: npm run start:api
    environment: *application-environment
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  outbox-dispatcher:
    image: conversor-app:local
    command: npm run worker:outbox
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  conversion-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure

  notification-worker:
    image: conversor-app:local
    command: npm run worker:notification
    environment: *application-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    restart: on-failure

volumes:
  postgres_data_v18:
  rabbitmq_data:
  minio_data:
