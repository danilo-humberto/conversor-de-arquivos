<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Envie um arquivo de áudio ou vídeo para conversão."
    />
    <title>Conversor de Arquivos</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="converter" aria-labelledby="page-title">
        <div class="intro">
          <p class="eyebrow">Conversão de mídia</p>
          <h1 id="page-title">Converta seu arquivo</h1>
          <p>
            Envie um áudio ou vídeo, escolha o formato de saída e receba a
            confirmação por e-mail quando a conversão terminar.
          </p>
        </div>

        <form id="conversion-form" novalidate>
          <div class="field">
            <label for="file">Arquivo</label>
            <input
              id="file"
              name="file"
              type="file"
              accept="audio/*,video/*"
              required
            />
            <p class="help-text" id="file-help">
              Aceitamos arquivos de áudio e vídeo.
            </p>
          </div>

          <div class="field">
            <label for="target-format">Formato de destino</label>
            <select id="target-format" name="targetFormat" required disabled>
              <option value="">Escolha primeiro um arquivo</option>
            </select>
          </div>

          <div class="field">
            <label for="notify-email">E-mail para notificação</label>
            <input
              id="notify-email"
              name="notifyEmail"
              type="email"
              autocomplete="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <button id="submit-button" type="submit">Enviar para conversão</button>
        </form>

        <section
          id="status-panel"
          class="status-panel"
          aria-live="polite"
          hidden
        >
          <p class="status-label" id="status-label">Preparando envio</p>
          <p class="status-message" id="status-message"></p>
          <p class="job-id" id="job-id" hidden></p>
        </section>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
